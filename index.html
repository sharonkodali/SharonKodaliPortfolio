<style>
:root {
  --pond: #150a19;
  --pond2: #2a1533;
  --cream: #eedff3;
  --cream2: rgba(243,231,207,.62);
  --pink: #e58fc4;
  --papaya: #f08a3c;
  --mustard: #e8b84a;
  --leaf: #4f7a4a;
  --olive: #8a9a3a;
  --ink: #150a19;
  --paper: #f6eedc;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--pond); color: var(--cream); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }

/* the pond: one full-screen canvas */
#pond { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none;
  background: radial-gradient(ellipse at 50% 40%, #3a1d45 0%, #241130 45%, #12081a 100%); }
#pond.grab { cursor: grab; }
#pond.grabbing { cursor: grabbing; }

/* corners */
.corner { position: fixed; z-index: 3; font-size: 12px; letter-spacing: .04em; color: var(--cream2); }
.corner a { text-decoration: none; transition: color .2s; }
.corner a:hover { color: var(--cream); }
.tl { top: 22px; left: 26px; font-family: 'Instrument Serif', serif; font-size: 22px; color: var(--cream); letter-spacing: 0; }
.tl span { color: var(--pink); font-style: italic; }
.tr { top: 26px; right: 26px; display: flex; gap: 20px; }
.bl { bottom: 22px; left: 26px; pointer-events: none; transition: opacity .8s; }
.br { bottom: 22px; right: 26px; pointer-events: none; }

/* center copy */
.hello { position: fixed; left: 50%; top: 64%; transform: translate(-50%, 0); z-index: 2; text-align: center; width: 92%; pointer-events: none; }
.hello h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(56px, 9vw, 128px); line-height: .92; letter-spacing: -.01em; color: var(--cream);
  text-shadow: 0 2px 30px rgba(18,8,26,.7); opacity: 0; transform: translateY(14px); animation: rise 1.1s .9s cubic-bezier(.2,.8,.2,1) forwards; }
.hello h1 em { color: var(--pink); }
.hello p { margin-top: 14px; font-size: clamp(13px, 1.2vw, 15px); color: var(--cream2); letter-spacing: .02em; opacity: 0; animation: rise 1s 1.25s cubic-bezier(.2,.8,.2,1) forwards; }
.pills { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 3; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 92%;
  opacity: 0; animation: fade 1s 1.5s ease forwards; }
.pill { font-family: 'Geist', sans-serif; font-size: 13px; letter-spacing: .02em; color: var(--cream); background: rgba(243,231,207,.07); border: 1px solid rgba(243,231,207,.24);
  padding: 10px 18px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background .2s, color .2s, border-color .2s, transform .2s; }
.pill:hover, .pill:focus-visible { background: var(--cream); color: var(--ink); border-color: var(--cream); transform: translateY(-2px); outline: none; }
.pill .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes fade { to { opacity: 1; } }

/* panels */
.sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(8,16,11,.45); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity .35s; }
.sheet-bg.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 11; left: 50%; top: 50%; width: min(760px, calc(100vw - 32px)); max-height: min(82vh, 760px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); color: var(--ink); border-radius: 22px; padding: 38px 42px 34px; box-shadow: 0 40px 90px rgba(0,0,0,.45);
  transform: translate(-50%, -46%) scale(.97); opacity: 0; pointer-events: none; transition: opacity .35s, transform .45s cubic-bezier(.2,.9,.25,1.1); }
.sheet.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
.sheet .x { position: sticky; top: 0; float: right; margin: -14px -18px 0 0; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(21,33,26,.2); background: var(--paper); cursor: pointer; font-size: 18px; color: var(--ink); }
.sheet .x:hover { background: var(--ink); color: var(--paper); }
.kick { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9a5a3a; }
.sheet h2 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(38px, 5vw, 54px); line-height: 1; margin: 8px 0 22px; }
.sheet h2 em { color: #c4486a; }
.sheet p { font-size: 15px; line-height: 1.7; color: #33433a; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-family: 'Geist Mono', monospace; font-size: 11px; padding: 5px 10px; border-radius: 999px; background: rgba(21,33,26,.07); color: #33433a; }
.sub { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b7a6f; margin: 28px 0 10px; }

.proj { display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 16px; padding: 20px 0; border-top: 1px solid rgba(21,33,26,.12); }
.proj:first-of-type { border-top: none; }
.proj .sw { width: 12px; height: 12px; border-radius: 50%; margin-top: 10px; }
.proj h3 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 28px; line-height: 1.1; }
.proj .when { font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b7a6f; margin-top: 12px; white-space: nowrap; }
.proj .body { grid-column: 2 / 4; }
.proj .metric { display: inline-block; font-family: 'Geist Mono', monospace; font-size: 12px; margin: 8px 0 4px; padding: 4px 10px; border-radius: 999px; background: #fbe1d2; color: #9a3f1c; }
.links { display: flex; gap: 14px; margin-top: 12px; font-size: 13px; }
.links a { text-decoration: none; border-bottom: 1px solid rgba(21,33,26,.3); padding-bottom: 1px; }
.links a:hover { color: #c4486a; border-color: #c4486a; }

.job { padding: 18px 0; border-top: 1px solid rgba(21,33,26,.12); display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; }
.job:first-of-type { border-top: none; }
.job h3 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 25px; line-height: 1.15; }
.job .org { font-size: 13px; color: #9a5a3a; }
.job .when { font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b7a6f; margin-top: 8px; white-space: nowrap; }
.job p { grid-column: 1 / 3; margin-top: 6px; font-size: 14px; }

.contact-list { display: grid; gap: 10px; margin-top: 6px; }
.contact-list a { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-radius: 14px; background: rgba(21,33,26,.05); text-decoration: none; font-size: 15px; transition: background .2s, transform .2s; }
.contact-list a:hover { background: var(--ink); color: var(--paper); transform: translateX(4px); }
.contact-list span:last-child { font-family: 'Geist Mono', monospace; font-size: 12px; opacity: .7; }


/* recruiter-facing bits */
.hello { top: 60%; }
.hello .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 6px 14px; border-radius: 999px; background: rgba(243,231,207,.08); border: 1px solid rgba(243,231,207,.18); font-size: 12.5px; color: var(--cream); animation-delay: 1.4s; }
.live { width: 7px; height: 7px; border-radius: 50%; background: #8fd48a; box-shadow: 0 0 0 0 rgba(143,212,138,.6); animation: pulse 2.2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(143,212,138,0); } 100% { box-shadow: 0 0 0 0 rgba(143,212,138,0); } }
a.pill { text-decoration: none; display: inline-block; }
.sheet.wide { width: min(940px, calc(100vw - 32px)); }
.sheet b { font-weight: 500; color: #9a3f1c; }
.job ul { grid-column: 1 / 3; list-style: none; margin-top: 8px; display: grid; gap: 6px; }

.job .chips { grid-column: 1 / 3; margin-top: 10px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 20px; }
.f { font-family: 'Geist Mono', monospace; font-size: 11.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(21,33,26,.2); background: none; color: var(--ink); cursor: pointer; transition: all .2s; }
.f:hover { border-color: var(--ink); }
.f.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.featured { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card { background: #fffaf0; border: 1px solid rgba(21,33,26,.1); border-radius: 16px; padding: 20px 20px 18px; display: flex; flex-direction: column; transition: transform .25s, box-shadow .25s; }
.card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(21,33,26,.1); }
.card .top { display: flex; align-items: center; gap: 10px; }
.card .sw { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.card h3 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 26px; line-height: 1.1; }
.card p { font-size: 14px; line-height: 1.6; margin-top: 8px; flex: 1; }
.metrics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.metrics span { font-family: 'Geist Mono', monospace; font-size: 11.5px; padding: 4px 9px; border-radius: 999px; background: #fbe1d2; color: #9a3f1c; }
.stack { font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b7a6f; margin-top: 12px; }
.more { display: grid; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; padding: 14px 0; border-top: 1px solid rgba(21,33,26,.1); }
.row:first-child { border-top: none; }
.row h4 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 21px; }
.row p { font-size: 13.5px; line-height: 1.55; margin-top: 2px; }
.row .links { margin-top: 6px; white-space: nowrap; }
.soon { font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b7a6f; }
.edu { display: flex; justify-content: space-between; gap: 16px; font-size: 15px; line-height: 1.6; color: #33433a; }
.edu b { color: var(--ink); }
.edu .when { font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #6b7a6f; white-space: nowrap; margin-top: 4px; }
.small { font-size: 13px !important; margin-top: 8px; color: #6b7a6f !important; }
.skills { display: grid; grid-template-columns: 110px 1fr; gap: 8px 16px; font-size: 14px; line-height: 1.55; color: #33433a; }
.skills dt { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #6b7a6f; padding-top: 3px; }
[data-tags].hide { display: none; }

@media (max-width: 640px) {
  .tl { top: 18px; left: 18px; }
  .tr { top: 22px; right: 18px; gap: 14px; }
  .bl, .br { display: none; }
  .hello { top: 60%; }
  .pills { bottom: max(26px, env(safe-area-inset-bottom)); gap: 8px; }
  .pill { padding: 9px 14px; font-size: 12.5px; }
  .sheet { padding: 30px 22px 26px; border-radius: 18px; max-height: 86vh; }
  .sheet .x { margin: -10px -8px 0 0; }
  .proj { grid-template-columns: 12px 1fr; }
  .proj .when { grid-column: 2; margin-top: 0; }
  .proj .body { grid-column: 2; }
  .featured { grid-template-columns: 1fr; }
  .row { grid-template-columns: 1fr; gap: 4px; }
  .skills { grid-template-columns: 1fr; gap: 2px 0; }
  .skills dd { margin-bottom: 8px; }
  .edu { flex-direction: column; gap: 2px; }
  .hello { top: 56%; }
  .hello .status { font-size: 11.5px; }
}
@media (prefers-reduced-motion: reduce) { .hello h1, .hello p, .pills { animation-duration: .01s; animation-delay: 0s; } }
</style>

<script>
// ---------- the pond: an ASCII water lily, lily pads, and ripples on one character grid ----------
(function(){
  var canvas = document.getElementById('pond'), ctx = canvas.getContext('2d');
  var hint = document.getElementById('hint');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var BG = [30, 15, 38];
  var RAMP = '.,:-=+*o#%@', FLICK = '*+°o·';
  var C = {
    water: [176, 138, 204], ripple: [238, 223, 243], wake: [210, 186, 226],
    pad: [110, 132, 58], pad2: [168, 160, 60], padRim: [74, 96, 44],
    base: [250, 226, 244], petal: [[196, 60, 140], [178, 110, 210], [232, 136, 190]],
    stamen: [232, 184, 74], anther: [240, 138, 60], pollen: [232, 184, 74]
  };

  var W, H, cw, ch, cols, rows, chr, cr, cg, cb, zb;
  var lx, ly, S;              // lily screen center and scale
  function layout(){
    var mobile = W < 640;
    lx = W/2; ly = H*(mobile ? .36 : .37);
    S = mobile ? Math.min(W*.52, H*.3) : Math.min(W*.27, H*.4);
  }
  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ch = W < 640 ? 9 : 11;
    ctx.font = ch + 'px "Geist Mono", ui-monospace, monospace'; ctx.textBaseline = 'top';
    cw = ctx.measureText('M').width;
    cols = Math.ceil(W/cw); rows = Math.ceil(H/ch);
    var n = cols*rows;
    chr = new Uint16Array(n); cr = new Uint8Array(n); cg = new Uint8Array(n); cb = new Uint8Array(n); zb = new Float32Array(n);
    layout();
    if(pads.length) pads.forEach(function(p){ p.x = Math.min(p.x, W); p.y = Math.min(p.y, H); });
  }
  function clamp(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x){ x = clamp(x); return 1 - Math.pow(1 - x, 3); }
  function rand(a,b){ return a + Math.random()*(b - a); }
  function set(idx, code, col, a){
    chr[idx] = code;
    cr[idx] = BG[0] + (col[0] - BG[0])*a; cg[idx] = BG[1] + (col[1] - BG[1])*a; cb[idx] = BG[2] + (col[2] - BG[2])*a;
  }

  // ----- state -----
  var t = 0, yaw = .5, yawVel = 0, pitch = .5, pitchT = .5;
  var bloom = 0, bloomT = 1, rebloomAt = -1;
  var mouse = { x: -1e4, y: -1e4, has: false, lastWake: 0, px: 0, py: 0 };
  var ripples = [], pollen = [], pads = [];
  var LIGHT = (function(){ var v = [-.4, .8, .45], l = Math.hypot(v[0], v[1], v[2]); return [v[0]/l, v[1]/l, v[2]/l]; })();

  function makePads(){
    pads = [];
    var n = W < 640 ? 5 : 8;
    for(var i = 0; i < n; i++){
      var a = i/n*Math.PI*2 + rand(-.3, .3), d = rand(.36, .62);
      pads.push({ x: W/2 + Math.cos(a)*W*d*.62, y: H*.5 + Math.sin(a)*H*d*.78, r: rand(30, W < 640 ? 52 : 74),
        rot: rand(0, Math.PI*2), spin: rand(-.06, .06), vx: rand(-6, 6), vy: rand(-4, 4), shade: Math.random(), born: rand(.2, 1.4) });
    }
  }

  // ----- water + ripples -----
  function drawWater(){
    var sq = 1/.5;  // ripples are flattened ellipses (we look at the pond at an angle)
    for(var r = 0; r < rows; r++){
      var py = r*ch + ch/2;
      for(var c = 0; c < cols; c++){
        var idx = r*cols + c, px = c*cw + cw/2;
        var v = Math.sin(c*.06 + r*.11 + t*.45)*Math.sin(r*.19 - c*.025 - t*.3) + .55*Math.sin((c*.31 - r*.9)*.08 + t*.22);
        var best = 0, bc = 0;
        for(var k = 0; k < ripples.length; k++){
          var rp = ripples[k], age = t - rp.t0;
          var d = Math.hypot(px - rp.x, (py - rp.y)*sq), R = age*rp.speed;
          var off = Math.abs(d - R);
          if(off < rp.width){
            var s = (1 - off/rp.width)*(1 - age/rp.life);
            if(s > best){ best = s; bc = rp.mini ? 1 : 2; }
          }
        }
        if(best > .08){
          var ch2 = best > .6 ? 111 : best > .3 ? 176 : 46; // o ° .
          set(idx, ch2, bc === 2 ? C.ripple : C.wake, .25 + .6*best);
        } else if(v > .9 && ((c*7 + r*13) % 5) < 3){
          set(idx, v > 1.05 ? 126 : 45, C.water, .12 + (v - .9)*.5); // ~ -
        } else chr[idx] = 0;
        zb[idx] = -1e9;
      }
    }
  }

  // ----- lily pads (2D, flattened) -----
  function drawPads(dt){
    for(var i = 0; i < pads.length; i++){
      var p = pads[i], g = reduce ? 1 : ease((t - p.born)/1.4);
      if(g <= 0) continue;
      // forces: cursor pushes, the lily pushes, a gentle current
      if(mouse.has){
        var dx = p.x - mouse.x, dy = (p.y - mouse.y)*1.6, d = Math.hypot(dx, dy);
        if(d < 150 && d > 1){ var f = (1 - d/150)*240; p.vx += dx/d*f*dt; p.vy += dy/d*f*dt*.6; }
      }
      var ldx = p.x - lx, ldy = (p.y - ly)*1.5, ld = Math.hypot(ldx, ldy), keep = S*1.25 + p.r;
      if(ld < keep && ld > 1){ var f2 = (1 - ld/keep)*160; p.vx += ldx/ld*f2*dt; p.vy += ldy/ld*f2*dt; }
      p.vx += Math.sin(t*.2 + i)*.8*dt; p.vy += Math.cos(t*.17 + i*2)*.5*dt;
      p.vx *= .985; p.vy *= .985; p.spin *= .99;
      if(!reduce){ p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.spin*dt; }
      // keep pads out from under the corner links (top) and the buttons (bottom); wrap sideways only
      var top = 70 + p.r*.4, bot = H - 120 - p.r*.4;
      if(p.y < top) p.vy += (top - p.y)*2.2*dt; else if(p.y > bot) p.vy -= (p.y - bot)*2.2*dt;
      var m = p.r + 30;
      if(p.x < -m) p.x = W + m; else if(p.x > W + m) p.x = -m;
      var R = p.r*g, c0 = Math.max(0, ((p.x - R)/cw)|0), c1 = Math.min(cols - 1, ((p.x + R)/cw)|0);
      var r0 = Math.max(0, ((p.y - R*.5)/ch)|0), r1 = Math.min(rows - 1, ((p.y + R*.5)/ch)|0);
      var cr0 = Math.cos(-p.rot), sr0 = Math.sin(-p.rot);
      for(var r = r0; r <= r1; r++){
        for(var c = c0; c <= c1; c++){
          var x = c*cw + cw/2 - p.x, y = (r*ch + ch/2 - p.y)*2;
          var d2 = Math.hypot(x, y);
          if(d2 > R) continue;
          var rx = x*cr0 - y*sr0, ry = x*sr0 + y*cr0, an = Math.atan2(ry, rx);
          if(Math.abs(an) < .3 && d2 > R*.12) continue;               // the notch
          var idx = r*cols + c, e = d2/R;
          var vein = Math.abs(Math.sin(an*5)) < .12 && e > .18;
          if(e > .86) set(idx, 35, C.padRim, .95);                     // #
          else if(vein) set(idx, 47 + (an > 0 ? 45 : 0), C.padRim, .8);   // / \
          else {
            var lit = clamp(.55 + (-x - y*.6)/R*.35);
            set(idx, RAMP.charCodeAt(2 + ((lit*6)|0)), p.shade > .5 ? C.pad : C.pad2, .55 + lit*.4);
          }
        }
      }
    }
  }

  // ----- the lily (3D, z-buffered) -----
  var cyw, syw, cp, sp;
  function plot(x, y, z, nx, ny, nz, col, kind){
    var x1 = x*cyw + z*syw, z1 = -x*syw + z*cyw;
    var y2 = y*cp - z1*sp, z2 = y*sp + z1*cp;
    var px = lx + x1*S, py = ly - y2*S;
    var c = (px/cw)|0, r = (py/ch)|0;
    if(c < 0 || r < 0 || c >= cols || r >= rows) return;
    var idx = r*cols + c;
    if(z2 <= zb[idx]) return;
    zb[idx] = z2;
    var b;
    if(nx === null) b = .6 + z2*.4;
    else {
      var nx1 = nx*cyw + nz*syw, nz1 = -nx*syw + nz*cyw;
      var ny2 = ny*cp - nz1*sp, nz2 = ny*sp + nz1*cp;
      b = .25 + .75*Math.abs(nx1*LIGHT[0] + ny2*LIGHT[1] + nz2*LIGHT[2]);
    }
    b = clamp(b);
    if(kind === 3){ set(idx, ':-=+'.charCodeAt(Math.min(3, (b*4)|0)), col, .32 + .28*b); return; }
    var code = kind === 2 ? 64 : RAMP.charCodeAt(Math.min(RAMP.length - 1, (b*RAMP.length)|0));
    if(!reduce && Math.random() < .01) code = FLICK.charCodeAt((Math.random()*FLICK.length)|0);
    set(idx, code, col, kind === 4 ? .6 + .4*b : .35 + .65*b);
  }
  function mix(a, b, m){ return [a[0] + (b[0] - a[0])*m, a[1] + (b[1] - a[1])*m, a[2] + (b[2] - a[2])*m]; }

  // a big pad under the flower, then three rings of cupped petals, then stamens
  var RINGS = [
    { n: 9, L: .6, W: .16, r0: .08, open: .42, closed: 1.3, cup: .55, col: 0 },
    { n: 9, L: .5, W: .14, r0: .06, open: .82, closed: 1.42, cup: .5, col: 1 },
    { n: 7, L: .36, W: .11, r0: .04, open: 1.12, closed: 1.5, cup: .35, col: 2 }
  ];
  function drawLily(){
    cyw = Math.cos(yaw); syw = Math.sin(yaw); cp = Math.cos(pitch); sp = Math.sin(pitch);
    var g = reduce ? 1 : ease((t - .1)/1.2);
    // base pad
    var PR = .78*g;
    for(var ri = 1; ri <= 12; ri++){
      var rr = ri/12*PR, steps = 14 + ri*6;
      for(var k = 0; k < steps; k++){
        var an = k/steps*Math.PI*2;
        if(Math.abs(Math.atan2(Math.sin(an - 2.2), Math.cos(an - 2.2))) < .22 && ri > 2) continue;
        var vein = Math.abs(Math.sin(an*6)) < .1;
        plot(Math.cos(an)*rr, -.02, Math.sin(an)*rr, 0, 1, 0, ri === 12 ? C.padRim : vein ? C.padRim : (k % 3 ? C.pad : C.pad2), 3);
      }
    }
    // petals
    for(var j = 0; j < RINGS.length; j++){
      var R = RINGS[j], bj = clamp(bloom*1.25 - j*.12);
      var el0 = R.closed + (R.open - R.closed)*bj;
      for(var k2 = 0; k2 < R.n; k2++){
        var phi = k2/R.n*Math.PI*2 + j*.35, cph = Math.cos(phi), sph = Math.sin(phi);
        var tg = [-sph, 0, cph];
        var px = cph*R.r0, py = .0 + j*.02, pz = sph*R.r0;
        var NU = 22;
        for(var u = 1; u <= NU; u++){
          var uu = u/NU, el = el0 + R.cup*uu*uu;
          var ce = Math.cos(el), se = Math.sin(el);
          var dir = [cph*ce, se, sph*ce];
          var step = R.L/NU;
          px += dir[0]*step; py += dir[1]*step; pz += dir[2]*step;
          var w = R.W*Math.pow(Math.sin(Math.PI*Math.min(uu*1.08, 1)), .65);
          var nrm = [dir[1]*tg[2] - dir[2]*tg[1], dir[2]*tg[0] - dir[0]*tg[2], dir[0]*tg[1] - dir[1]*tg[0]];
          var col = mix(C.base, C.petal[R.col], Math.pow(uu, .45));
          for(var v = -5; v <= 5; v++){
            var o = v/5, lift = o*o*w*.35;   // edges curl up: a cupped petal
            plot(px + tg[0]*o*w + nrm[0]*lift, py + nrm[1]*lift, pz + tg[2]*o*w + nrm[2]*lift, nrm[0], nrm[1], nrm[2], col, 4);
          }
        }
      }
    }
    // stamens
    var sg = clamp(bloom*1.4 - .3);
    if(sg > 0){
      for(var s = 0; s < 22; s++){
        var a = s/22*Math.PI*2, rad = .05 + (s % 2)*.03, len = (.16 + (s % 3)*.03)*sg;
        var ox = Math.cos(a)*rad, oz = Math.sin(a)*rad;
        for(var q = 1; q <= 6; q++) plot(ox*(1 + q*.08), .03 + len*q/6, oz*(1 + q*.08), null, null, null, C.stamen, 0);
        plot(ox*1.5, .03 + len*1.05, oz*1.5, null, null, null, C.anther, 2);
      }
    }
  }

  function drawPollen(dt){
    for(var i = pollen.length - 1; i >= 0; i--){
      var p = pollen[i], age = t - p.t0;
      if(age < 0) continue;
      if(age > p.life){ pollen.splice(i, 1); continue; }
      p.vy += 30*dt; p.x += p.vx*dt; p.y += p.vy*dt;
      var c = (p.x/cw)|0, r = (p.y/ch)|0;
      if(c < 0 || r < 0 || c >= cols || r >= rows) continue;
      set(r*cols + c, p.code, C.pollen, 1 - age/p.life);
    }
  }

  function render(dt){
    drawWater();
    drawPads(dt);
    drawLily();
    drawPollen(dt);
    ctx.clearRect(0, 0, W, H);
    var last = -1;
    for(var r = 0; r < rows; r++){
      for(var c = 0; c < cols; c++){
        var idx = r*cols + c, code = chr[idx];
        if(!code) continue;
        var key = (cr[idx] << 16) | (cg[idx] << 8) | cb[idx];
        if(key !== last){ ctx.fillStyle = 'rgb(' + cr[idx] + ',' + cg[idx] + ',' + cb[idx] + ')'; last = key; }
        ctx.fillText(String.fromCharCode(code), c*cw, r*ch);
      }
    }
  }

  // ----- interaction -----
  function onLily(x, y){ return Math.hypot(x - lx, (y - ly)*1.3) < S*.95; }
  function addRipple(x, y, mini){
    ripples.push(mini ? { x: x, y: y, t0: t, speed: 110, width: 9, life: 1.1, mini: true }
                      : { x: x, y: y, t0: t, speed: 210, width: 16, life: 2.4, mini: false });
    if(ripples.length > 16) ripples.shift();
    if(!mini) pads.forEach(function(p){
      var dx = p.x - x, dy = (p.y - y)*1.6, d = Math.hypot(dx, dy);
      if(d < 260 && d > 1){ p.vx += dx/d*60*(1 - d/260); p.vy += dy/d*40*(1 - d/260); p.spin += (Math.random() - .5)*1.2; }
    });
  }
  var dragging = false, downX = 0, downY = 0, lastX = 0, onFlower = false, used = false;
  function used1(){ if(!used){ used = true; hint.style.opacity = 0; } }
  canvas.addEventListener('pointerdown', function(e){
    downX = lastX = e.clientX; downY = e.clientY;
    onFlower = onLily(e.clientX, e.clientY);
    dragging = onFlower;
    if(dragging){ canvas.classList.add('grabbing'); canvas.setPointerCapture(e.pointerId); }
  });
  canvas.addEventListener('pointermove', function(e){
    var x = e.clientX, y = e.clientY;
    var speed = Math.hypot(x - mouse.px, y - mouse.py);
    mouse.x = x; mouse.y = y; mouse.has = true; mouse.px = x; mouse.py = y;
    canvas.classList.toggle('grab', !dragging && onLily(x, y));
    pitchT = .5 + (y/H - .5)*.2;
    if(dragging){ var dx = x - lastX; lastX = x; yawVel = dx*.007; yaw += yawVel; if(Math.abs(x - downX) > 6) used1(); }
    else if(speed > 6 && t - mouse.lastWake > .09 && !onLily(x, y) && e.pointerType !== 'touch'){ addRipple(x, y, true); mouse.lastWake = t; }
  });
  function up(e){
    var moved = Math.hypot(e.clientX - downX, e.clientY - downY);
    if(e.type === 'pointerup' && moved < 6){
      used1();
      if(onFlower){
        // re-bloom: close, then open again with a puff of pollen
        bloomT = 0; rebloomAt = t + .55;
        for(var i = 0; i < 26; i++) pollen.push({ x: lx + rand(-S*.15, S*.15), y: ly - S*.1, vx: rand(-90, 90), vy: rand(-170, -60), t0: t + .5, life: rand(1, 1.8), code: FLICK.charCodeAt((Math.random()*FLICK.length)|0) });
        addRipple(lx, ly + S*.15, false);
      } else addRipple(e.clientX, e.clientY, false);
    }
    dragging = false; canvas.classList.remove('grabbing');
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', function(){ mouse.has = false; });

  // ----- loop -----
  var prev = performance.now(), frame = 0;
  function tick(now){
    var dt = Math.min(.1, (now - prev)/1000); prev = now;
    frame++;
    // while a panel is open the pond keeps moving at half speed (it is blurred behind the panel)
    if(window.pondPaused && frame % 2) { requestAnimationFrame(tick); return; }
    t += dt;
    if(rebloomAt > 0 && t > rebloomAt){ bloomT = 1; rebloomAt = -1; }
    var hover = mouse.has && onLily(mouse.x, mouse.y) ? .12 : 0;
    var target = Math.min(1.1, bloomT + hover);
    bloom += (target - bloom)*(reduce ? 1 : (bloomT < bloom ? .09 : .028));
    if(!dragging){ yawVel *= .95; yaw += yawVel + (reduce ? 0 : .12*dt); }
    pitch += (pitchT - pitch)*.04;
    ripples = ripples.filter(function(r){ return t - r.t0 < r.life; });
    render(dt);
    requestAnimationFrame(tick);
  }
  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ var w0 = W; resize(); if(Math.abs(W - w0) > 120) makePads(); }, 120); });
  resize(); makePads();
  if(reduce) bloom = 1;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){ resize(); });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
